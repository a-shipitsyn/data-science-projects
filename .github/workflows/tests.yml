name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - ab-testing-experimentation
          - basic-trading-bot
          - debt-payment-likelihood
          - loan-default-prediction
          - marketing-mix-modeling
          - marketplace-recommender-system
          - masked-nucleotide-prediction
          - metal-profile-pricing-engine
          - product-review-analytics
          - rag-support-telegram-bot
          - research-paper-knowledge-base
    # Only the RAG bot uses it: its index and conversation-log tests need PostgreSQL with pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_test
      # CPU-only PyTorch wheels: much smaller than the default CUDA build.
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt pytest
      # llama-index needs NLTK stopwords; the runner has no NLTK data cached.
      - if: matrix.project == 'rag-support-telegram-bot'
        run: python -m nltk.downloader stopwords
      - run: pytest -q
